services:
  api:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://backendapi:backendpass@db:5432/mydb # On écrit l'adresse de la DB qui se trouve dans le conteneur db

  db:
    image: postgres:16
    container_name: backendapi-db
    environment:
      POSTGRES_USER: backendapi
      POSTGRES_PASSWORD: backendpass
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
